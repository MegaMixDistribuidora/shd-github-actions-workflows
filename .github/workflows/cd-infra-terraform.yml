# Reutilizável. Chamador: on: push em dev (environment: dev) e main (environment: prod); também o rollback.
name: Infra Terraform CD

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment e tfvars (dev ou prod)
        type: string
        required: true
      ref:
        description: Ref a aplicar (tag para rollback). Vazio = commit do evento.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - id: config
        uses: MegaMixDistribuidora/shd-github-actions-workflows/actions/parse-config@v1
        with:
          environment: ${{ inputs.environment }}

      - uses: MegaMixDistribuidora/shd-github-actions-workflows/actions/replace-tokens@v1
        with:
          files: ${{ steps.config.outputs.files-to-replace }}
          config: ${{ steps.config.outputs.config }}

      - uses: MegaMixDistribuidora/shd-github-actions-workflows/actions/setup-terraform-aws@v1
        with:
          terraform-version: ${{ steps.config.outputs.terraform-version }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

      - id: plan
        uses: MegaMixDistribuidora/shd-github-actions-workflows/actions/terraform-plan@v1
        with:
          working-directory: ${{ steps.config.outputs.working-path }}
          environment: ${{ inputs.environment }}
          backend-bucket: ${{ vars.TF_STATE_BUCKET }}
          backend-key: ${{ github.event.repository.name }}/terraform.tfstate
          lint: 'false'

      - uses: MegaMixDistribuidora/shd-github-actions-workflows/actions/terraform-apply@v1
        with:
          working-directory: ${{ steps.config.outputs.working-path }}
          plan-file: ${{ steps.plan.outputs.plan-file }}
