# ADR-14: todo commit na main gera tag vX.Y.Z e GitHub Release.
# A tag aponta para um commit FORA da main em que as referências internas
# MegaMixDistribuidora/shd-github-actions-workflows/actions/<nome>@... são
# reescritas para @vX.Y.Z — fixar a tag congela também as actions internas.
# Como esse commit não é alcançável pela main, a versão é calculada por
# scripts/next-version.sh a partir da última tag v* (e não pelo semantic-release).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: echo "version=$(bash scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Tag with pinned internal references
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          bash scripts/pin-internal-refs.sh "$VERSION" .github/workflows/*.yml
          if ! git diff --quiet; then
            git commit -qam "chore(release): v${VERSION}"
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: GitHub Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --generate-notes --title "v${VERSION}"
