name: Parse Issue Field
description: Lê um campo de issue form da issue do evento.

inputs:
  field:
    description: Título do campo (texto após "### ")
    required: true

outputs:
  value:
    description: Valor do campo
    value: ${{ steps.parse.outputs.value }}

runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      env:
        ISSUE_BODY: ${{ github.event.issue.body }}
      # Atribuição separada: um "echo $(...)" esconderia a falha do parser e o step passaria vazio.
      run: |
        value=$(bash "${{ github.action_path }}/parse-issue.sh" "${{ inputs.field }}")
        echo "value=$value" >> "$GITHUB_OUTPUT"
