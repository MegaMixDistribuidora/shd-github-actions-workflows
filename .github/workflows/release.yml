# ADR-14: todo commit na main gera tag vX.Y.Z e GitHub Release.
# As referências internas dos workflows usam a major móvel (@v1): o release cria
# vX.Y.Z no commit da main e move vX para ele. Nenhum arquivo é alterado — o
# GITHUB_TOKEN não pode fazer push de commit que mexa em .github/workflows.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        # Atribuição separada: "echo $(...)" esconderia a falha e o release sumiria em silêncio.
        run: |
          version=$(bash scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag e major móvel
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/tag-release.sh "$VERSION"
          major="v${VERSION%%.*}"
          git push origin "v${VERSION}"
          git push --force origin "refs/tags/${major}"

      - name: GitHub Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --generate-notes --title "v${VERSION}"
